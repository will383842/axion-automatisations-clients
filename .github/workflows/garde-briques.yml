name: garde-briques
# Sur chaque PR et chaque nuit : la garde des briques, puis Trivy sur chaque image inscrite.
# Une image dérivée (ADR 0016) doit porter une attestation de provenance signée par images-derivees.yml de ce dépôt, sur l'empreinte inscrite.
# Échec : critique corrigeable ouverte depuis plus de 7 jours, haute depuis plus de 30 jours. N'affiche que l'identifiant de l'avis et la brique. Aucun secret.
on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  garde-briques:
    name: garde-briques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Garde des briques (fichiers, empreintes, licences, redis, verrou)
        run: node scripts/garde-briques.ts
      - name: Attestation de provenance de chaque image dérivée (workflow signataire images-derivees.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          statut=0
          for ref in $(node scripts/garde-briques.ts --derivees); do
            fichier="$RUNNER_TEMP/attestation-$(printf '%s' "${ref%%@*}" | tr '/:' '--').json"
            gh attestation verify "oci://$ref" --repo will383842/axion-automatisations-clients --signer-workflow will383842/axion-automatisations-clients/.github/workflows/images-derivees.yml --format json > "$fichier" || { echo "Attestation introuvable ou refusée pour ${ref%%@*}" >&2; statut=1; continue; }
            node scripts/garde-briques.ts --attestation "$fichier" "$ref" || statut=1
          done
          exit "$statut"
      - name: Trivy (Apache-2.0, 0.58.2 épinglé par empreinte) sur chaque image inscrite
        run: |
          set -u
          statut=0
          mkdir -p "$RUNNER_TEMP/trivy"
          for image in $(node scripts/garde-briques.ts --lister); do
            nom="${image%%:*}"
            fichier="$RUNNER_TEMP/trivy/$(printf '%s' "$nom" | tr '/:' '--').json"
            docker run --rm -v "$RUNNER_TEMP/trivy:/sortie" ghcr.io/aquasecurity/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 image --scanners vuln --format json --quiet --output "/sortie/$(basename "$fichier")" "$image" || { echo "Trivy n'a pas répondu pour $nom" >&2; statut=1; continue; }
            node scripts/garde-briques.ts --trivy "$fichier" "$nom" || statut=1
          done
          exit "$statut"
