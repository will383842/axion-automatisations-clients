name: Harnais
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  harnais:
    name: harnais
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
        ports:
          - 127.0.0.1:8025:8025
          - 127.0.0.1:1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NODE_ENV: test
      MAILPIT_API: http://127.0.0.1:8025
      MAILPIT_SMTP_HOTE: 127.0.0.1
      MAILPIT_SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project packages/harnais
