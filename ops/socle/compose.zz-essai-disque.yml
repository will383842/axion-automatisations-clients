# Fragment d'essai, lancé seulement sur la CI : le plafond des journaux en attente d'archivage est réduit, et le volume pg-wal de production
# (compose.sauvegardes.yml : même volume, même montage /wal, même dossier POSTGRES_INITDB_WALDIR, même service wal-init) reçoit une taille,
# pour éprouver l'alerte et le plafond en quelques secondes (C-602).
# Ce fragment ne redéfinit PAS le dossier des journaux ni le montage : seule la nature du volume change (en mémoire, 256 Mo, car un volume Docker nommé n'a pas de taille).
# Les tests de ops/sauvegardes/dimensionner-wal.test.ts échouent si ce fragment détourne le volume.
# Volume 256 Mo, journaux de 16 Mo, max_wal_size 48 Mo, plafond 64 Mo (4 journaux : avant la création de la stanza, Keycloak en écrit déjà 3) : le plafond est atteint bien avant que le volume soit plein.
services:
  postgres:
    environment:
      PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX: 64MiB
      # P : mêmes réglages que compose.sauvegardes.yml, plus max_wal_size (sans lui, 1 Go de journaux dépasseraient le volume d'essai)
      P: -c archive_mode=on -c archive_timeout=300 -c wal_level=replica -c max_wal_size=48MB -c min_wal_size=32MB
    networks: [interne]
volumes:
  pg-wal:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=256m
