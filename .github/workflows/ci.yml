name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Une PR qui reçoit un nouveau commit annule ses exécutions devenues inutiles (la file GitHub est partagée par toutes les sessions).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  types-lint:
    name: types-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # un échec des types ne masque pas le lint
      - if: always()
        run: pnpm lint
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compter
      - run: node scripts/compter-tests.ts rapport-tests.json
  garde-workflows:
    name: garde-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/garde-workflows.ts .github/workflows
  licences:
    name: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/garde-licences.ts
  harnais:
    name: harnais
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
        ports:
          - 127.0.0.1:8025:8025
          - 127.0.0.1:1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NODE_ENV: test
      MAILPIT_API: http://127.0.0.1:8025
      MAILPIT_SMTP_HOTE: 127.0.0.1
      MAILPIT_SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project packages/harnais
  squelettes-web:
    name: squelettes-web
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # [A-047] next build réussit pour les deux applications et /api/sante répond après démarrage.
      - name: Construire, démarrer et interroger la console et le portail
        run: |
          set -eu
          port=3100
          for app in console portail; do
            pnpm --filter "@axion-auto/$app" build
            dossier="apps/$app/.next/standalone/apps/$app"
            mkdir -p "$dossier/.next"
            cp -r "apps/$app/.next/static" "$dossier/.next/static"
            PORT=$port HOSTNAME=127.0.0.1 node "$dossier/server.js" &
            pid=$!
            ok=0
            for _ in $(seq 30); do
              if curl -fsS "http://127.0.0.1:$port/api/sante" -o sante.json; then ok=1; break; fi
              sleep 1
            done
            kill "$pid" || true
            [ "$ok" = 1 ] || { echo "$app : /api/sante ne répond pas" >&2; exit 1; }
            node -e 'const c=JSON.parse(require("fs").readFileSync("sante.json","utf8"));if(c.etat!=="ok"||c.application!==process.argv[1])process.exit(1)' "$app"
            port=$((port+1))
          done
