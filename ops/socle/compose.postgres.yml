# PostgreSQL 16 (avec pg_partman) et PgBouncer en mode transaction. Réseau interne seulement, aucun port publié.
# Un secret de test unique vient de lancer.sh ; chaque rôle (superutilisateur compris) a son mot de passe : SHA-256 de « secret/rôle ». PgBouncer n'ouvre que les quatre rôles « app » et « équipe » : ni le superutilisateur, ni le propriétaire, ni la migration.
services:
  postgres:
    image: ghcr.io/will383842/axion-automatisations-clients/postgres-socle:16-r41@sha256:c5fd480db4b8537bfaf082b5b73cd6e288994309b4ac0bf8cc58694f6757e2ce
    restart: "no"
    environment:
      SOCLE_PG_MOT_DE_PASSE: ${SOCLE_PG_MOT_DE_PASSE:?mot de passe de test absent}
      # G : mot de passe du superutilisateur, distinct de celui de chaque rôle de l'application
      K: printf %s/postgres $$SOCLE_PG_MOT_DE_PASSE|sha256sum|cut -c1-64
      G: export POSTGRES_PASSWORD=$$(eval "$$K")
      X: sh
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    entrypoint: ['sh', '-c', 'eval "$$G"; exec docker-entrypoint.$$X postgres']
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d console"]
      interval: 2s
      timeout: 3s
      retries: 60
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    # Variables courtes : « docker compose config » replie les lignes de plus de 80 colonnes, ce que la garde ne lit pas.
    # R : rôles admis · L : format d'une ligne de la liste (\042 = guillemet) · M : secret de test · K : mot de passe d'un rôle · G : génération de la liste · B : configuration sans extension
    environment:
      R: console_app console_equipe moteur_app moteur_equipe
      L: '\042%s\042 \042%s\042\n'
      M: ${SOCLE_PG_MOT_DE_PASSE:?mot de passe de test absent}
      K: printf %s/%s $$M $$u|sha256sum|cut -c1-64
      G: 'for u in $$R; do printf "$$L" $$u $$(eval "$$K"); done >/tmp/u.txt'
      B: /etc/pgbouncer/conf/pgbouncer
    entrypoint: ['sh', '-c', 'eval "$$G"; exec pgbouncer $${B}.ini']
    volumes:
      - ./pgbouncer:/etc/pgbouncer/conf:ro
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 2s
      timeout: 3s
      retries: 30
