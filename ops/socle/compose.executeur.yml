# Réseaux de l'exécuteur : executeur-interne n'a aucune sortie ; sortie est réservé au mandataire.
# Aucune base de données n'est référencée ici : l'exécuteur ne rejoint aucun réseau de données.
networks:
  executeur-interne:
    internal: true
  sortie: {}

# Réseau du module enveloppe : interne, il ne joint que l'exécuteur (ADR 0104).
  enveloppe:
    internal: true

# Le service axion-moteur sera ajouté ici avec sa ligne image: ...@sha256:<empreinte> après la première publication (un service sans image rend le compose invalide).
