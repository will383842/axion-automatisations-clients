# Réseaux de l'exécuteur : executeur-interne n'a aucune sortie ; sortie est réservé au mandataire.
# Aucune base de données n'est référencée ici : l'exécuteur ne rejoint aucun réseau de données.
networks:
  executeur-interne:
    internal: true
  sortie: {}

# Réseau du module enveloppe : interne, il ne joint que l'exécuteur (ADR 0104).
  enveloppe:
    internal: true

services:
  # Pas de ligne image: tant que la première publication n'existe pas (la garde des briques exige une brique inscrite et l'attestation du workflow de publication).
  # Après la première publication, le chef d'orchestre ajoute ici image: ...@sha256:<empreinte> et inscrit ops/briques/axion-moteur.json.
  axion-moteur:
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      EXECUTEUR_MODE: mutualise
    networks: [executeur-interne]
