name: audit-dependances
# Critique : échec après 7 jours ; haute : échec après 30 jours (date de publication de l'avis). Aucun secret.
on:
  pull_request:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-dependances:
    name: audit-dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Relever les avis (le code de sortie de pnpm audit est ignoré, le script décide)
        run: pnpm audit --json > "$RUNNER_TEMP/audit.json" || true
      - run: node scripts/audit-dependances.ts "$RUNNER_TEMP/audit.json"
