; PgBouncer du socle : mode transaction, liste fermée d'utilisateurs (voir compose.postgres.yml), aucun administrateur.
[databases]
console = host=postgres port=5432 dbname=console
moteur = host=postgres port=5432 dbname=moteur

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
default_pool_size = 4
max_client_conn = 200
max_prepared_statements = 100
server_idle_timeout = 30
; Un SET de session fait par erreur ne doit pas rester sur la connexion serveur rendue au pool.
server_reset_query = DISCARD ALL
server_reset_query_always = 1
auth_type = scram-sha-256
auth_file = /tmp/u.txt
admin_users =
stats_users =
ignore_startup_parameters = extra_float_digits
