# Socle : le proxy et les deux réseaux. Les briques ajoutent un fragment compose.<brique>.yml, jamais ce fichier.
# Lancé par ops/socle/lancer.sh. Aucune valeur secrète ici.
name: socle
services:
  traefik:
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: "no"
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      DOMAINE_CONSOLE: ${DOMAINE_CONSOLE:-console.socle.test}
      DOMAINE_PORTAIL: ${DOMAINE_PORTAIL:-client.socle.test}
      DOMAINE_API: ${DOMAINE_API:-api.socle.test}
      DOMAINE_SSO: ${DOMAINE_SSO:-sso.socle.test}
    volumes:
      - ./traefik/statique.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamique.yml:/etc/traefik/dynamique/dynamique.yml:ro
      - ${SOCLE_CERTS:-/nonexistent}:/certs:ro
    networks: [entree]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  entree: {}
  interne:
    internal: true
