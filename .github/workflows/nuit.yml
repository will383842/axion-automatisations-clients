name: nuit
# Nuit du dépôt public : suite complète et analyse de sécurité. Tourne sur main, sans AUCUN secret
# ni code de PR externe (C-528). La recette de nuit à trois systèmes viendra au lot 1-B, hors de ce fichier.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-complets:
    name: tests-complets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Projets Playwright de nuit (1440, 390 WebKit, 412, 360) quand ils existent
        run: |
          if [ -f tests/e2e/playwright.config.ts ]; then
            pnpm exec playwright install --with-deps chromium webkit
            pnpm exec playwright test --config tests/e2e/playwright.config.ts
          else
            echo "Aucun projet Playwright pour l'instant."
          fi
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
