name: socle
services:
  postgres:
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    image: postgres:16.4@sha256:1111111111111111111111111111111111111111111111111111111111111111
    networks:
      interne: null
  traefik:
    image: traefik:v3.1.6@sha256:f703a2ac2ddf75f6e06c9cccac7f158765e2ab42d642b04e79e2e3d7355c2ddc
    networks:
      entree: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8443
        published: "8443"
        protocol: tcp
networks:
  entree:
    name: socle_entree
  interne:
    name: socle_interne
    internal: true
