# Fragment d'essai, lancé seulement sur la CI : quatre services d'écho derrière les noms de console, portail, API et Keycloak.
# Une brique réelle remplace l'écho correspondant en reprenant son nom de réseau.
services:
  essai-console:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    restart: "no"
    environment:
      WHOAMI_NAME: console
      WHOAMI_PORT_NUMBER: "3000"
    networks:
      entree:
        aliases: [console]
  essai-portail:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    restart: "no"
    environment:
      WHOAMI_NAME: portail
      WHOAMI_PORT_NUMBER: "3000"
    networks:
      entree:
        aliases: [portail]
  essai-api:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    restart: "no"
    environment:
      WHOAMI_NAME: api
      WHOAMI_PORT_NUMBER: "3001"
    networks:
      entree:
        aliases: [api]
  essai-keycloak:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    restart: "no"
    environment:
      WHOAMI_NAME: keycloak
      WHOAMI_PORT_NUMBER: "8080"
    networks:
      entree:
        aliases: [keycloak]
