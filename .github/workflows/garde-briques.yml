name: garde-briques
# Sur chaque PR et chaque nuit : la garde des fichiers de briques (empreintes, licences, redis, verrou).
# Une image dérivée (ADR 0016) doit porter une attestation de provenance signée par images-derivees.yml de ce dépôt, sur l'empreinte inscrite. Aucun secret.
on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  garde-briques:
    name: garde-briques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Garde des briques (fichiers, empreintes, licences, redis, verrou)
        run: node scripts/garde-briques.ts
      - name: Attestation de provenance de chaque image dérivée (workflow signataire images-derivees.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          statut=0
          for ref in $(node scripts/garde-briques.ts --derivees); do
            fichier="$RUNNER_TEMP/attestation-$(printf '%s' "${ref%%@*}" | tr '/:' '--').json"
            gh attestation verify "oci://$ref" --repo will383842/axion-automatisations-clients --signer-workflow will383842/axion-automatisations-clients/.github/workflows/images-derivees.yml --format json > "$fichier" || { echo "Attestation introuvable ou refusée pour ${ref%%@*}" >&2; statut=1; continue; }
            node scripts/garde-briques.ts --attestation "$fichier" "$ref" && echo "attestation vérifiée : $ref" || statut=1
          done
          exit "$statut"
