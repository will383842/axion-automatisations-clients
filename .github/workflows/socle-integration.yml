name: Socle intégration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Une PR qui reçoit un nouveau commit annule ses exécutions devenues inutiles (la file GitHub est partagée par toutes les sessions).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fragment-1:
    name: socle-integration-fragment-1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Garde du compose, fichier par fichier puis assemblé
        run: |
          node scripts/garde-compose.ts ops/socle/compose.*.yml ops/socle/traefik/dynamique.yml
          ops/socle/lancer.sh --assembler > "$RUNNER_TEMP/assemble.yml"
          node scripts/garde-compose.ts "$RUNNER_TEMP/assemble.yml"
      - name: Lancer le socle
        run: ops/socle/lancer.sh
      - name: Tests d'intégration, fragment 1 sur 3
        run: pnpm exec vitest run --project integration --reporter=default --reporter=blob --outputFile.blob=rapports-vitest/blob-1-3.json
        env:
          SOCLE_INTEGRATION: "1"
          FRAGMENT_INTEGRATION: "1/3"
      - name: Envoyer le rapport du fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapport-integration-1
          path: rapports-vitest/blob-1-3.json
          if-no-files-found: error
          retention-days: 1
      - name: Arrêter le socle
        if: always()
        run: ops/socle/arreter.sh

  fragment-2:
    name: socle-integration-fragment-2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Garde du compose, fichier par fichier puis assemblé
        run: |
          node scripts/garde-compose.ts ops/socle/compose.*.yml ops/socle/traefik/dynamique.yml
          ops/socle/lancer.sh --assembler > "$RUNNER_TEMP/assemble.yml"
          node scripts/garde-compose.ts "$RUNNER_TEMP/assemble.yml"
      - name: Lancer le socle
        run: ops/socle/lancer.sh
      - name: Tests d'intégration, fragment 2 sur 3
        run: pnpm exec vitest run --project integration --reporter=default --reporter=blob --outputFile.blob=rapports-vitest/blob-2-3.json
        env:
          SOCLE_INTEGRATION: "1"
          FRAGMENT_INTEGRATION: "2/3"
      - name: Envoyer le rapport du fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapport-integration-2
          path: rapports-vitest/blob-2-3.json
          if-no-files-found: error
          retention-days: 1
      - name: Arrêter le socle
        if: always()
        run: ops/socle/arreter.sh

  fragment-3:
    name: socle-integration-fragment-3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Garde du compose, fichier par fichier puis assemblé
        run: |
          node scripts/garde-compose.ts ops/socle/compose.*.yml ops/socle/traefik/dynamique.yml
          ops/socle/lancer.sh --assembler > "$RUNNER_TEMP/assemble.yml"
          node scripts/garde-compose.ts "$RUNNER_TEMP/assemble.yml"
      - name: Lancer le socle
        run: ops/socle/lancer.sh
      - name: Tests d'intégration, fragment 3 sur 3
        run: pnpm exec vitest run --project integration --reporter=default --reporter=blob --outputFile.blob=rapports-vitest/blob-3-3.json
        env:
          SOCLE_INTEGRATION: "1"
          FRAGMENT_INTEGRATION: "3/3"
      - name: Envoyer le rapport du fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapport-integration-3
          path: rapports-vitest/blob-3-3.json
          if-no-files-found: error
          retention-days: 1
      - name: Arrêter le socle
        if: always()
        run: ops/socle/arreter.sh

  socle-integration:
    name: socle-integration
    needs: [fragment-1, fragment-2, fragment-3]
    # Toujours lancé : un job requis « sauté » vaudrait réussi pour la protection de main. Ne jamais remplacer par !cancelled() (ADR 0118, ADR 0121).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESULTATS_FRAGMENTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Les trois fragments ont réussi
        run: test "$RESULTATS_FRAGMENTS" = "success success success"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rapport-integration-*
          path: rapports-vitest
          merge-multiple: true
      - name: Rassembler les rapports des fragments
        run: pnpm exec vitest --merge-reports rapports-vitest --reporter=json --outputFile=rapport-integration.json
      - name: Garde du compose, fichier par fichier puis assemblé
        run: |
          node scripts/garde-compose.ts ops/socle/compose.*.yml ops/socle/traefik/dynamique.yml
          ops/socle/lancer.sh --assembler > "$RUNNER_TEMP/assemble.yml"
          node scripts/garde-compose.ts "$RUNNER_TEMP/assemble.yml"
      # Le compteur (C-538) liste les tests de la PR et de la base par « vitest list » : des fichiers interrogent le socle au chargement.
      - name: Lancer le socle
        run: ops/socle/lancer.sh
      - name: Compter les tests d'intégration
        run: node scripts/compter-tests.ts --projet integration --rapport rapport-integration.json
      - name: Arrêter le socle
        if: always()
        run: ops/socle/arreter.sh
