name: Squelettes web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Une PR qui reçoit un nouveau commit annule ses exécutions devenues inutiles (la file GitHub est partagée par toutes les sessions).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  squelettes-web:
    name: squelettes-web
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # [A-047] next build réussit pour les deux applications et /api/sante répond après démarrage.
      - name: Construire, démarrer et interroger la console et le portail
        run: |
          set -eu
          port=3100
          for app in console portail; do
            pnpm --filter "@axion-auto/$app" build
            dossier="apps/$app/.next/standalone/apps/$app"
            mkdir -p "$dossier/.next"
            cp -r "apps/$app/.next/static" "$dossier/.next/static"
            PORT=$port HOSTNAME=127.0.0.1 node "$dossier/server.js" &
            pid=$!
            ok=0
            for _ in $(seq 30); do
              if curl -fsS "http://127.0.0.1:$port/api/sante" -o sante.json; then ok=1; break; fi
              sleep 1
            done
            kill "$pid" || true
            [ "$ok" = 1 ] || { echo "$app : /api/sante ne répond pas" >&2; exit 1; }
            node -e 'const c=JSON.parse(require("fs").readFileSync("sante.json","utf8"));if(c.etat!=="ok"||c.application!==process.argv[1])process.exit(1)' "$app"
            port=$((port+1))
          done
