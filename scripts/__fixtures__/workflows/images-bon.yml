name: images
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  construire:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, console, portail]
    steps:
      - run: docker build -f "apps/$APP/Dockerfile" -t "local/$APP" .
        env:
          APP: ${{ matrix.app }}
  publier:
    needs: construire
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
