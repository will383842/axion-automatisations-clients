; PgBouncer de la grappe données (T2-31, ADR 0046) : mode transaction, plafonds par base, mots de passe lus dans PostgreSQL par auth_query.
; Le fichier de mots de passe est généré au lancement (compose.donnees.yml) et ne contient que pgbouncer_auth. Aucun administrateur.
[databases]
; Base de recherche des mots de passe (auth_dbname) : seul pgbouncer_auth y entre.
authentification = host=donnees port=5432 dbname=postgres
; Une ligne par client, écrite par le provisionnement (T2-34) : pool_size=2|4|8 selon le palier, max_db_connections égal à pool_size.
; Entrées d'essai (identifiants inventés) pour les paliers 4 et 8 :
cli_aaaaaaaaaaa4 = host=donnees port=5432 pool_size=4 max_db_connections=4
cli_aaaaaaaaaaa8 = host=donnees port=5432 pool_size=8 max_db_connections=8
; Palier de base pour toute autre base : le serveur refuse l'entrée (REVOKE CONNECT) tant qu'elle n'est pas créée pour le client.
* = host=donnees port=5432 pool_size=2 max_db_connections=2

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
default_pool_size = 2
max_db_connections = 2
; Plafond global de connexions client ; le plafond de 250 connexions serveur est celui de PostgreSQL (compose.donnees.yml).
max_client_conn = 1000
; Un client en attente d'une connexion serveur reçoit un refus après 10 s plutôt que d'attendre sans fin.
query_wait_timeout = 10
max_prepared_statements = 100
server_idle_timeout = 30
; Rien de l'état d'une session ne passe au client suivant.
server_reset_query = DISCARD ALL
server_reset_query_always = 1
auth_type = scram-sha-256
auth_file = /tmp/u.txt
auth_user = pgbouncer_auth
auth_dbname = authentification
auth_query = SELECT usename, passwd FROM pgbouncer.chercher_utilisateur($1)
admin_users =
stats_users =
ignore_startup_parameters = extra_float_digits
