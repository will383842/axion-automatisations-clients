name: Garde des données réelles
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
# Une PR qui reçoit un nouveau commit annule ses exécutions devenues inutiles (la file GitHub est partagée par toutes les sessions).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  garde-donnees:
    name: garde-donnees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Refuser toute donnée réelle (extrait Sirene, e-mail réel, API de registre public)
        run: node scripts/garde-donnees-reelles.ts
